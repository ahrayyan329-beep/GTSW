<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTSW - Grand Theft Series Walkthrough</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0220;overflow:hidden;
    font-family:"Arial Black",Impact,Arial,sans-serif;color:#fff}
  button{font-family:inherit;cursor:pointer}

  /* ===== MENU ===== */
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;z-index:10;
    background:linear-gradient(180deg,#1a0536 0%,#6a1b9a 35%,#ff2d95 70%,#ff9a3c 100%);
    overflow:hidden}
  #menu::before{content:"";position:absolute;left:-50%;right:-50%;bottom:0;height:45%;
    background:
      repeating-linear-gradient(90deg,rgba(0,255,255,.55) 0 2px,transparent 2px 70px),
      repeating-linear-gradient(0deg,rgba(255,0,200,.55) 0 2px,transparent 2px 40px),
      linear-gradient(180deg,rgba(20,0,50,.2),rgba(10,0,30,.95));
    transform:perspective(300px) rotateX(55deg);transform-origin:bottom;
    animation:grid 2s linear infinite}
  @keyframes grid{to{background-position:0 0,0 40px,0 0}}
  .sun{position:absolute;top:12%;width:42vmin;height:42vmin;border-radius:50%;
    background:linear-gradient(180deg,#ffe36e,#ff5fa2);opacity:.55;filter:blur(1px)}
  .content{position:relative;z-index:2;padding:16px}
  h1{font-size:clamp(56px,16vw,140px);font-style:italic;font-weight:900;letter-spacing:4px;
    background:linear-gradient(180deg,#fff 10%,#ff9ad5 55%,#c77dff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,45,149,.9)) drop-shadow(4px 4px 0 #3a0a6b)}
  .sub{font-style:italic;font-weight:900;letter-spacing:3px;
    font-size:clamp(12px,3.2vw,22px);text-transform:uppercase;margin:6px 0 28px;
    text-shadow:0 0 10px #00f0ff,0 0 20px #00f0ff}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
  .btn{width:min(280px,70vw);padding:12px 20px;font-size:clamp(16px,4vw,22px);
    font-style:italic;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff;
    background:rgba(20,0,50,.55);border:2px solid #00f0ff;border-radius:4px;
    box-shadow:0 0 12px #00f0ff,inset 0 0 12px rgba(0,240,255,.3);
    transform:skewX(-10deg);transition:.15s}
  .btn:hover,.btn:active{background:#ff2d95;border-color:#fff;
    box-shadow:0 0 22px #ff2d95;transform:skewX(-10deg) scale(1.05)}

  /* ===== MODAL (Credits / Quit) ===== */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(8,0,24,.85);padding:20px;text-align:center}
  .modal.show{display:flex}
  .box{max-width:460px;padding:24px;border:2px solid #ff2d95;border-radius:6px;
    background:#1a0536;box-shadow:0 0 25px #ff2d95}
  .box h2{font-style:italic;margin-bottom:12px;text-shadow:0 0 10px #00f0ff}
  .box p{font-family:Arial,sans-serif;font-weight:bold;line-height:1.5;margin-bottom:16px;font-size:14px}

  /* ===== MODE VIDEO ===== */
  #player-screen{position:fixed;inset:0;background:#000;z-index:20;display:none}
  #player-screen.show{display:block}
  #yt-holder,#yt-holder iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .controls{position:absolute;top:10px;left:10px;right:10px;z-index:40;
    display:flex;justify-content:space-between;pointer-events:none}
  .controls .btn{pointer-events:auto;width:auto;padding:8px 16px;font-size:13px;letter-spacing:2px}

  /* ===== OVERLAY PORTRAIT ===== */
  #rotate{position:absolute;inset:0;z-index:30;background:rgba(10,0,30,.96);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px}
  #rotate .ico{font-size:64px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
  #rotate p{margin-top:14px;font-style:italic;font-size:20px;text-shadow:0 0 10px #ff2d95}
  @media (orientation:portrait){
    #player-screen.show #rotate{display:flex}
  }
</style>
</head>
<body>

<!-- MENU UTAMA -->
<div id="menu">
  <div class="sun"></div>
  <div class="content">
    <h1>GTSW</h1>
    <div class="sub">Grand Theft Series Walkthrough</div>
    <div class="btns">
      <button class="btn" id="btnPlay">Play</button>
      <button class="btn" id="btnCredits">Credits</button>
      <button class="btn" id="btnQuit">Quit</button>
    </div>
  </div>
</div>

<!-- MODE VIDEO -->
<div id="player-screen">
  <div id="yt-holder"></div>
  <div class="controls">
    <button class="btn" id="btnSkip">Skip Intro</button>
    <button class="btn" id="btnMenu">Menu</button>
  </div>
  <div id="rotate">
    <div class="ico">📱</div>
    <p>Putar HP ke Landscape</p>
  </div>
</div>

<!-- CREDITS -->
<div class="modal" id="creditsModal">
  <div class="box">
    <h2>CREDITS</h2>
    <p>GTSW - Grand Theft Series Walkthrough<br>Dibuat sebagai proyek fan-made.<br>
    Video milik pemilik aslinya di YouTube.</p>
    <button class="btn" data-close="creditsModal">Tutup</button>
  </div>
</div>

<!-- QUIT -->
<div class="modal" id="quitModal">
  <div class="box">
    <h2>TERIMA KASIH!</h2>
    <p>Sampai jumpa lagi. Kamu bisa menutup tab ini.</p>
    <button class="btn" data-close="quitModal">Kembali</button>
  </div>
</div>

<script>
(function(){
  var VIDEO_INTRO = "-vTbkyFhsGw";
  var VIDEO_WALK  = "FV8S_ceyfM0";

  var $ = function(id){return document.getElementById(id)};
  var menu = $("menu"), screenEl = $("player-screen"), holder = $("yt-holder"),
      btnSkip = $("btnSkip");

  var player = null, phase = "intro", apiReady = false, pendingStart = false;

  /* ---- Muat YouTube IFrame API ---- */
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = function(){
    apiReady = true;
    if(pendingStart){ pendingStart = false; createPlayer(); }
  };

  /* ---- Buat iframe youtube-nocookie ---- */
  function createPlayer(){
    holder.innerHTML = "";
    var iframe = document.createElement("iframe");
    var params = "autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1";
    if(location.origin && location.origin.indexOf("http") === 0){
      params += "&origin=" + encodeURIComponent(location.origin);
    }
    iframe.id = "yt-frame";
    iframe.src = "https://www.youtube-nocookie.com/embed/" + VIDEO_INTRO + "?" + params;
    iframe.setAttribute("referrerpolicy","strict-origin-when-cross-origin");
    iframe.setAttribute("allow","autoplay; fullscreen; encrypted-media; picture-in-picture");
    iframe.setAttribute("allowfullscreen","");
    iframe.setAttribute("title","GTSW Video");
    holder.appendChild(iframe);

    player = new YT.Player(iframe, {
      events:{ onStateChange: onStateChange }
    });
  }

  function onStateChange(e){
    // 0 = ENDED
    if(e.data === 0 && phase === "intro"){
      toWalkthrough(false);
    }
  }

  function toWalkthrough(fromClick){
    phase = "walk";
    btnSkip.textContent = "Selesai";
    if(player && player.loadVideoById){
      player.loadVideoById(VIDEO_WALK);
      if(fromClick && player.unMute) player.unMute(); // klik = gestur user
    }
  }

  /* ---- Fullscreen & orientasi ---- */
  function enterFullscreen(){
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    var p;
    try{ p = req && req.call(el); }catch(err){}
    if(p && p.then){
      p.then(lockLandscape).catch(function(){});
    }else{
      lockLandscape();
    }
  }
  function lockLandscape(){
    try{
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock("landscape").catch(function(){});
      }
    }catch(err){}
  }
  function exitFullscreenMode(){
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(err){}
    var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    try{
      if((document.fullscreenElement || document.webkitFullscreenElement) && ex){
        var p = ex.call(document); if(p && p.catch) p.catch(function(){});
      }
    }catch(err){}
  }

  /* ---- Alur ---- */
  function startPlay(){
    phase = "intro";
    btnSkip.textContent = "Skip Intro";
    menu.style.display = "none";
    screenEl.classList.add("show");
    enterFullscreen();
    if(apiReady){ createPlayer(); } else { pendingStart = true; }
  }

  function backToMenu(){
    pendingStart = false;
    try{ if(player && player.destroy) player.destroy(); }catch(err){}
    player = null;
    holder.innerHTML = "";
    screenEl.classList.remove("show");
    menu.style.display = "flex";
    exitFullscreenMode();
  }

  $("btnPlay").onclick = startPlay;
  $("btnMenu").onclick = backToMenu;
  btnSkip.onclick = function(){
    if(phase === "intro"){ toWalkthrough(true); }
    else { backToMenu(); }
  };

  /* ---- Credits / Quit ---- */
  $("btnCredits").onclick = function(){ $("creditsModal").classList.add("show"); };
  $("btnQuit").onclick = function(){
    $("quitModal").classList.add("show");
    try{ window.close(); }catch(err){}
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"), function(b){
    b.onclick = function(){ $(b.getAttribute("data-close")).classList.remove("show"); };
  });
})();
</script>
</body>
</html>
